<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Preserve Quran text; language changes are handled inside the app. -->
  <meta name="google" content="notranslate">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Authentic Islamic education, modern skills, and a community that supports every learner.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Afaq">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Afaq</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #fcfaf6; }
    #app-loading { position: fixed; inset: 0; z-index: 10; overflow: auto; display: grid; place-items: center; box-sizing: border-box; padding: 28px 20px; color: #092136; background: radial-gradient(ellipse at 20% 10%, #f0e6cf 0, transparent 55%), radial-gradient(ellipse at 90% 90%, #e6eff1 0, transparent 50%), #fcfaf6; font-family: "Trebuchet MS", sans-serif; }
    .startup-card { box-sizing: border-box; width: min(100%, 470px); padding: 40px; border: 1px solid #e2e5e5; border-radius: 24px; background: #ffffffed; box-shadow: 0 24px 80px #0921360d; }
    .startup-brand { display: flex; align-items: center; gap: 14px; }
    .startup-brand svg { flex: none; width: 52px; height: 58px; }
    .startup-brand strong { font-size: 30px; letter-spacing: -.8px; }
    .startup-brand span { display: block; color: #586b7b; font-size: 13px; margin-top: 4px; }
    .startup-divider { width: 40px; height: 3px; background: #b58b32; margin: 32px 0 22px; border-radius: 3px; }
    #startup-title { font-size: 26px; letter-spacing: -.5px; line-height: 1.25; margin: 0 0 12px; }
    #startup-description { color: #536679; font-size: 16px; line-height: 1.6; margin: 0; min-height: 52px; }
    .startup-progress { overflow: hidden; height: 5px; border-radius: 5px; background: #edf0f2; margin: 28px 0 20px; }
    .startup-progress::after { content: ""; display: block; width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d9b455, #a87722); animation: startup-travel 1.8s ease-in-out infinite alternate; }
    .startup-steps { list-style: none; display: flex; gap: 10px; justify-content: space-between; padding: 0; margin: 0; font-size: 12px; color: #5b6f7c; }
    .startup-steps li { display: flex; align-items: center; gap: 6px; }
    .startup-steps li::before { content: ""; width: 7px; height: 7px; flex: none; border-radius: 50%; background: #d5dce0; }
    .startup-steps .is-current { color: #825e18; font-weight: bold; }
    .startup-steps .is-current::before { background: #b58b32; }
    .startup-steps .is-done::before { background: #278167; }
    #startup-retry { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 10px; padding: 13px 20px; margin-top: 26px; background: #102b40; color: white; font: bold 15px "Trebuchet MS", sans-serif; cursor: pointer; }
    #startup-retry:focus-visible { outline: 3px solid #b58b32; outline-offset: 4px; }
    #startup-retry svg { width: 18px; height: 18px; }
    #startup-retry[hidden] { display: none; }
    #app-loading[data-state="error"] .startup-progress::after { animation: none; width: 100%; background: #b58b32; }
    .startup-footer { color: #627583; font-size: 12px; margin: 28px 0 0; line-height: 1.6; }
    @keyframes startup-travel { from { transform: translateX(-50%); } to { transform: translateX(235%); } }
    @media (max-width: 480px) { .startup-card { padding: 28px 24px; } #startup-title { font-size: 24px; } .startup-steps { gap: 6px; font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { .startup-progress::after { animation: none; width: 60%; } }
  </style>
</head>
<body translate="no" class="notranslate">
  <div id="app-loading" aria-busy="true">
    <section class="startup-card" aria-labelledby="startup-title">
    <div class="startup-brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path fill="#c39743" d="M50 2 73 26 50 49 27 26Z"/>
      <path fill="#092136" d="M25 29C10 43 3 58 5 83L29 91C28 73 35 63 47 53ZM75 29C90 43 97 58 95 83L71 91C72 73 65 63 53 53Z"/>
    </svg>
    <div><strong>Afaq</strong><span>Knowledge today. Brighter tomorrows.</span></div>
    </div>
    <div class="startup-divider" aria-hidden="true"></div>
    <div role="status" aria-live="polite" aria-atomic="true">
      <h1 id="startup-title">Opening your learning space</h1>
      <p id="startup-description">Preparing Afaq for you.</p>
    </div>
    <div class="startup-progress" aria-hidden="true"></div>
    <ol class="startup-steps" aria-label="Startup stages">
      <li id="startup-step-0" class="is-current" aria-current="step">Prepare app</li>
      <li id="startup-step-1">Start display</li>
      <li id="startup-step-2">Open workspace</li>
    </ol>
    <button id="startup-retry" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 6"/></svg>
      Try again
    </button>
    <p class="startup-footer">Your saved work stays in your account.</p>
    </section>
  </div>
  <noscript><style>#app-loading { display: none; }</style><p>Please enable JavaScript to open your learning space.</p></noscript>
  <script src="app_loading.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
