<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001f3f" />
    <title>MODERN ISLAMIC FOUNDATION</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, #f7f4ec 0%, #f3ede0 100%);
        color: #001f3f;
      }

      .offline-card {
        width: min(100%, 480px);
        padding: 32px 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(212, 164, 11, 0.22);
        box-shadow: 0 24px 60px rgba(0, 31, 63, 0.08);
        text-align: center;
      }

      .mark-wrap {
        width: 112px;
        height: 112px;
        margin: 0 auto 18px;
        border-radius: 50%;
        overflow: hidden;
        border: 1px solid rgba(212, 164, 11, 0.26);
        background: #ffffff;
      }

      .mark-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #b98909;
        font: 700 0.74rem/1.2 sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #536684;
        font: 500 1rem/1.7 sans-serif;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="mark-wrap">
        <img src="/brand/mif-mark.svg" alt="MODERN ISLAMIC FOUNDATION mark" />
      </div>
      <p class="eyebrow">Offline Mode</p>
      <h1>MODERN ISLAMIC FOUNDATION</h1>
      <p>The app is currently offline. Reconnect to continue with live reports, classroom updates, and finance activity.</p>
    </main>
  </body>
  </html>
